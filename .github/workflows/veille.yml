name: Veille technologique

on:
  schedule:
    - cron: "0 7 * * 1-5"
    - cron: "30 15 * * 5"
  workflow_dispatch:
    inputs:
      rejouer_fiches:
        description: "Renvoyer les articles des 30 derniers jours dans le salon des fiches (sans toucher au salon principal)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer la veille
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FICHES_WEBHOOK_URL: ${{ secrets.DISCORD_FICHES_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.rejouer_fiches }}" = "true" ]; then
            python veille.py --rejouer --fiches-seulement --jours 30 --max 12
          elif [ "${{ github.event.schedule }}" = "30 15 * * 5" ]; then
            python veille.py --digest --max 25
          else
            python veille.py
          fi

      - name: Memoriser les articles deja publies
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json archives/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "veille: mise a jour automatique"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1